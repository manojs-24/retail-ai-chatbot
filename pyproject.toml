[project]
name = "retail-ai"
version = "1.0.0"
description = "AI-Powered Smart Retail Intelligence & Recommendation System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.9",
    "langchain-community>=0.3.7",
    "langgraph>=0.2.50",
    "chromadb>=0.5.20",
    "langchain-chroma>=0.2.0",
    "pypdf>=5.1.0",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.9.0",
    "openai>=1.55.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.3",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.9.0",
    "ragas>=0.2.14,<0.3.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
